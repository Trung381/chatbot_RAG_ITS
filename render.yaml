services:
  - type: web
    name: fastapi-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    healthCheckPath: "/api/v1/health"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: fastapi-redis
          property: connectionString

databases:
  - name: fastapi-db
    databaseName: fastapi_db
    user: fastapi_user

services:
  - type: redis
    name: fastapi-redis
    maxmemoryPolicy: allkeys-lru
